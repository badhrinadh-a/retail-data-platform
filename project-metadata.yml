project_name: Retail Data Platform
summary: |
  A locally deployable retail-focused data engineering platform built with Docker Compose.
  It simulates an enterprise data pipeline using Kafka for streaming, Spark for batch/stream compute,
  Airflow for orchestration, MinIO as object storage, PostgreSQL for metadata, and Jenkins for CI/CD.
tech_stack:
  - Apache Spark 3.4.1
  - Apache Kafka 7.4.0
  - Apache Airflow 2.7.1
  - MinIO
  - PostgreSQL 13
  - Jenkins LTS
  - Python 3
  - Docker Compose
services:
  - name: postgres
    role: Airflow metadata database
    image: postgres:13
    ports: [5432]
    volumes: [postgres_data:/var/lib/postgresql/data]
    notes: |
      Stores Airflow metadata, task state, DAG runs, and connection config.
      Healthchecked with pg_isready.
  - name: minio
    role: local S3-compatible object storage
    image: minio/minio:RELEASE.2023-09-07T02-05-02Z
    ports: [9000, 9001]
    volumes: [minio_data:/data]
    notes: |
      Provides storage for bronze/silver/gold datasets and other artifacts.
      Exposes web console on 9001.
  - name: minio-setup
    role: bucket initialization helper
    image: minio/mc
    notes: |
      Waits for MinIO to start and creates bronze, silver, and gold buckets.
      It is a one-shot helper container.
  - name: zookeeper
    role: Kafka cluster coordination
    image: confluentinc/cp-zookeeper:7.4.0
    ports: [2181]
    notes: |
      Required by Kafka for broker coordination and leader election.
  - name: kafka
    role: streaming ingestion broker
    image: confluentinc/cp-kafka:7.4.0
    ports: [9092, 29092]
    depends_on: [zookeeper]
    notes: |
      Hosts Kafka topics used by the retail data pipeline. Advertises localhost on 9092 and internal compose network on 29092.
  - name: spark-master
    role: Spark cluster master node
    image: apache/spark:3.4.1
    ports: [8080, 7077]
    volumes: [./src:/opt/spark/src, ./data:/opt/spark/data]
    notes: |
      Manages Spark worker registration and job scheduling.
      Exposes Spark UI on 8080 and master RPC on 7077.
  - name: spark-worker
    role: Spark worker node
    image: apache/spark:3.4.1
    ports: [8081]
    depends_on: [spark-master]
    volumes: [./src:/opt/spark/src, ./data:/opt/spark/data]
    notes: |
      Executes Spark tasks and reports to spark-master.
      Configured with 2G memory and 2 cores.
  - name: airflow-init
    role: Airflow initialization & database upgrade
    build: docker/Dockerfile.airflow
    command: version
    notes: |
      Runs once to initialize Airflow DB, upgrade schema, and create the default admin user.
      Uses the same custom Airflow image as webserver and scheduler.
  - name: airflow-webserver
    role: Airflow web UI and API
    build: docker/Dockerfile.airflow
    ports: [8085]
    depends_on: [postgres, airflow-init]
    notes: |
      Provides the Airflow UI and exposes it on host port 8085.
      Uses LocalExecutor and connects to PostgreSQL and MinIO.
  - name: airflow-scheduler
    role: Airflow DAG scheduler and task launcher
    build: docker/Dockerfile.airflow
    depends_on: [postgres, airflow-init]
    notes: |
      Continuously schedules DAG runs and triggers task execution.
  - name: jenkins
    role: CI/CD automation server
    build: docker/Dockerfile.jenkins
    ports: [8082, 50000]
    volumes: [jenkins_home:/var/jenkins_home, /var/run/docker.sock:/var/run/docker.sock]
    notes: |
      Provides Jenkins automation for pipeline jobs and can manage Docker builds inside the host Docker daemon.
      Runs as user jenkins with Docker CLI installed.
directories:
  airflow:
    description: Airflow DAGs and plugin definitions
  src:
    description: Core Python application code, Kafka producers, Spark jobs, shared utilities, and SQL assets
  docker:
    description: Custom Docker image definitions for Airflow and Jenkins
  docs:
    description: Architecture, setup, and workflow documentation
  scripts:
    description: CLI helpers for environment bootstrapping and service initialization
  jenkins:
    description: Jenkins pipeline configurations and CI/CD assets
build:
  airflow_image: docker/Dockerfile.airflow
  jenkins_image: docker/Dockerfile.jenkins
  notes: |
    The Airflow image is based on apache/airflow:2.7.1 and installs Python requirements from requirements.txt.
    The Jenkins image is based on jenkins/jenkins:lts and adds Python, make, curl, and Docker CLI.
startup:
  recommended: |
    make build
    make up
    ./scripts/setup_minio.sh
    ./scripts/bootstrap.sh
    python src/kafka/producer.py
  docs: docs/local-setup.md
key_files:
  - README.md
  - docker-compose.yml
  - project-metadata.yml
  - docker/Dockerfile.airflow
  - docker/Dockerfile.jenkins
  - requirements.txt
  - pyproject.toml
  - airflow/dags
  - src/kafka
notes: |
  The compose stack is intended for local development and simulates a retail data lake architecture.
  Airflow orchestrates jobs that likely read from Kafka, write data to MinIO, and process with Spark.
  Jenkins provides a separate CI/CD control plane for automation and deployment testing.
